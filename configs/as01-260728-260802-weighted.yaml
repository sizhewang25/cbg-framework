# Traffic-weighted arm for as01-260728-260802.
#
#   # 1. derive the subset beside the weight-bearing mesh
#   snakemake -s scripts/processing/source/derive_traffic_weighted_cbg_data.smk \
#       -j 1 --config mesh=datasets/final/as01-20260728-20260802.mainland.sanitized.tbweight.csv
#   # 2. run
#   ./cli.sh --configfile configs/as01-260728-260802-weighted.yaml
#
# Both steps are driven for you by ./run_finals.sh.
#
# PRECOMPUTED mode. The subset is read off the CSV rather than re-derived, so
# the same file feeds the benchmark and the §8.1 dataset figures. Equivalent to
# on-the-fly `eval_kept_traffic_fraction: 0.95` -- both run the identical
# keyless whole-mesh derivation.
#
# >>> SET THESE TWO PATHS <<<
# `mesh_csv_path` must be the mesh ANNOTATED WITH REAL TRAFFIC VOLUME. The
# `.tbweight` suffix is a convention, not a requirement -- point it wherever
# your weight-bearing export lives. It is NOT the plain mesh (which has no
# weight column) and NOT `.randweight` (uniform synthetic weights, a pipeline
# fixture only). `weighted_csv_path` is what step 1 above emits beside it.
#
# Fit is untouched: the other K-1 folds' targets, each keeping every flow it has.

run_id: as01-260728-260802-weighted

benchmark:
  source: traffic_weighted_csv
  setup: anchors_to_probes
  slices: [fold_0, fold_1, fold_2, fold_3, fold_4]

  source_kwargs:
    mesh_csv_path: datasets/final/as01-20260728-20260802.mainland.sanitized.tbweight.csv
    weighted_csv_path: datasets/final/as01-20260728-20260802.mainland.sanitized.tbweight.traffic-weighted.csv
    k: 5
    seed: 42
    asn_bucket_top_n: 20

  enable_fallback: true
  seed: 42

  # The five combos the published as0X runs scored, with their exact kwargs
  # (recovered from those runs' run.json). Kept identical across all finals
  # configs so mesh and weighted arms are directly comparable.
  combos:
    - combo_id: vanilla_cbg
      ltd: low_envelope
      mtl: planar_circle
      ctr: geometric_centroid
      mtl_kwargs:
        n_pts: 64
        enable_circle_filter: true

    - combo_id: million_scale_cbg
      ltd: speed_of_internet
      mtl: planar_circle
      ctr: geometric_centroid
      ltd_kwargs:
        speed_ratio: 0.6667
      mtl_kwargs:
        n_pts: 64
        enable_circle_filter: true

    - combo_id: octant_cbg_hull
      ltd: bounded_spline
      mtl: planar_annulus_weighted
      ctr: monte_carlo_medoid
      ltd_kwargs:
        fit_spline: false
        cutoff_min_points: 5
        bin_size_ms: 5.0
      mtl_kwargs:
        n_pts: 64
        enable_circle_filter: true
        weight_tau_ms: 50.0
        highest_weight_only: true
      ctr_kwargs:
        n_samples: 1024

    - combo_id: octant_cbg_spl
      ltd: bounded_spline
      mtl: planar_annulus_weighted
      ctr: monte_carlo_medoid
      ltd_kwargs:
        target_coverage: 0.9
        cutoff_min_points: 5
        fit_spline: true
        spline_n_knots: 4
        bin_size_ms: 5.0
      mtl_kwargs:
        n_pts: 64
        enable_circle_filter: true
        weight_tau_ms: 50.0
        highest_weight_only: true
      ctr_kwargs:
        n_samples: 1024

    - combo_id: spotter_cbg
      ltd: normal_dist
      mtl: planar_annulus_weighted
      ctr: monte_carlo_medoid
      ltd_kwargs:
        n_bins: 40
        min_per_bin: 5
        deg_mu: 3
        deg_sigma: 2
        bin_size_ms: 5.0
        cutoff_min_points: 5
      mtl_kwargs:
        n_pts: 64
        enable_circle_filter: true
        weight_tau_ms: 50.0
        highest_weight_only: true
      ctr_kwargs:
        n_samples: 1024


analysis:
  common:
    grid: h3
    resolution: [4]

  plot-bipartite-graph:
    # Flow map only — the topology map keeps the nearest-seed boundary,
    # which is its subject; on the flow map it competes with the edge ink
    # and shares its colour with the seed markers.
    no_flow_voronoi: true
