    #     n_bins: 40
    #     min_per_bin: 5
    #     deg_mu: 3
    #     deg_sigma: 2
    #     bin_size_ms: 5.0
    #     cutoff_min_points: 5
    #   mtl_kwargs:
    #     n_pts: 64
    #     enable_circle_filter: true
