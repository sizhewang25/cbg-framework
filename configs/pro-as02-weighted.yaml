run_id: pro-as02-weighted

benchmark:
  source: traffic_weighted_csv
  setup: anchors_to_probes
  slices: [fold_0, fold_1, fold_2, fold_3, fold_4]

  source_kwargs:
    mesh_csv_path: datasets/final/
    weighted_csv_path: datasets/final/
    k: 5
    seed: 42
    asn_bucket_top_n: 20

  enable_fallback: true
  seed: 42

  combos:
    - combo_id: vanilla_cbg
      ltd: low_envelope
      mtl: planar_circle
      ctr: geometric_centroid
      mtl_kwargs:
        n_pts: 64
        enable_circle_filter: true

    - combo_id: million_scale_cbg
      ltd: speed_of_internet
      mtl: planar_circle
      ctr: geometric_centroid
      ltd_kwargs:
        speed_ratio: 0.6667
      mtl_kwargs:
        n_pts: 64
        enable_circle_filter: true

    - combo_id: octant_cbg_hull
      ltd: bounded_spline
      mtl: planar_annulus_weighted
      ctr: monte_carlo_medoid
      ltd_kwargs:
        fit_spline: false
        cutoff_min_points: 5
        bin_size_ms: 5.0
      mtl_kwargs:
        n_pts: 64
        enable_circle_filter: true
        weight_mode: inv_power
        weight_k: 2
        highest_weight_only: true
      ctr_kwargs:
        n_samples: 1024

    - combo_id: octant_cbg_spl
      ltd: bounded_spline
      mtl: planar_annulus_weighted
      ctr: monte_carlo_medoid
      ltd_kwargs:
        fit_spline: true
        spline_n_knots: 4
        target_coverage: 0.9
        cutoff_min_points: 5
        bin_size_ms: 5.0
      mtl_kwargs:
        n_pts: 64
        enable_circle_filter: true
        weight_mode: inv_power
        weight_k: 2
        highest_weight_only: true
      ctr_kwargs:
        n_samples: 1024

    - combo_id: spotter_cbg
      ltd: normal_dist
      mtl: gaussian_density
      ctr: density_argmax
      ltd_kwargs:
        deg_mu: 3
        deg_sigma: 2
        cutoff_min_points: 5
      mtl_kwargs:
        grid: healpix
        resolution: 128
        coarse_resolution: 16
        top_k: 8
        neighbor_ring: 1


analysis:
  common:
    # The dataset this run belongs to, for v5's cross-dataset figures.
    # Declared rather than parsed: v5 used to split the run id on its first
    # hyphen, which reads `pro` for every run here.
    dataset_label: PRO-TF AS-2
    grid: healpix
    resolution: [128]

    pni_csv: datasets/pni/as15169.csv
    peer_asn: 15169

  plot-bipartite-graph:
    no_flow_voronoi: true

  plot-spotter-normality:
    group_by: vp_id
    n_permutations: 200

  build-pni-feasibility:
    decoy_trials: 200

  compare-pni-linearity:
    holdout_only: true

  plot-pni-delay:
    rtt_col: rtt_ms
    pni_prefix: sel_pni
    tg_prefix: target
    where: is_holdout
    x_max: 5000
    x_tick: 1000
    y_max: 100
    y_tick: 20
