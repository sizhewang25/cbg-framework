# Unified config for the as01-260728-260802 operator run.
#
#   python -m scripts.analysis.v3.cli --config configs/as01-260728-260802.yaml classify
#
# No `benchmark:` content: this run has no benchmark config in the repo. Its
# canonical CSV was reconstructed from the run outputs, and the folds are pinned
# by the materialized stratification rather than by a config. See
# configs/template.yaml for the schema.

run_id: as01-260728-260802

benchmark: {}

analysis:
  common:
    grid: h3
    resolution: [4]

  build-answer-space: {}

  build-bipartite-graph: {}

  build-proximity: {}

  plot-bipartite-graph:
    us_only: true
    # Flow map only — the topology map keeps the nearest-seed boundary,
    # which is its subject; on the flow map it competes with the edge ink
    # and shares its colour with the seed markers.
    no_flow_voronoi: true

  breakdown-accuracy:
    topn: "1,3"

  confusion-density:
    topn: "1,3"

  classify:
    topn: "1,3"

  # Error-distance CDF, one curve per method, log x, fallbacks excluded.
  plot-error-cdf: {}

  # Coordinate error against class error, one panel per method. Two y modes:
  # cells away from the true class, and classes outranking it (top-N's own
  # quantity). See README "Where the two metrics disagree".
  plot-error-vs-cells: {}
  plot-error-vs-rank: {}

  plot-venn:
    top_n: 1

  plot-answer-space:
    us_only: true                     # mainland-US target set

  plot-mtl-map:
    workers: 8                        # region replay is the slow part; see --no-regions

  plot-pareto:
    top_n: 1
    cost: runtime
    cost_stat: p50

  # --- PNI stack (§7.3, §8.1) --------------------------------------------
  # The 14-site AS20940 list read off the operator dashboard. Approximate:
  # metro identity from a screenshot, coordinates substituted from known
  # carrier hotels, CONUS-cropped. `peer_asn` is asserted explicitly because
  # the reconstructed source CSV lost its `target_asn` column.
  detect-pni-strategy:
    pni_csv: datasets/pni/as01-us-pni.approx.csv
    peer_asn: 20940

  build-pni-graph:
    pni_csv: datasets/pni/as01-us-pni.approx.csv
    peer_asn: 20940
    # `mixed` verdict (no policy took a majority), so the argmin fallback
    # stands: it assumes no policy rather than asserting one.
    strategy: argmin
    split_csv: outputs/analysis/v3/as01-260728-260802/pni-strategy/pair_split.csv

  build-pni-feasibility:
    decoy_trials: 200

  # The graph was built under a detected --strategy, so scoring on the pairs
  # the rule was chosen from would be a fit evaluated on itself.
  compare-pni-linearity:
    holdout_only: true

  breakdown-sping-pni: {}
