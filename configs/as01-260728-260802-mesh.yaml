# Mesh (unweighted) finals run for as01-260728-260802.
#
#   ./cli.sh --configfile configs/as01-260728-260802-mesh.yaml
#
# MESH arm: `generic_csv` reads a `weight` column if present and carries it into
# the parquet, but never filters on it. Deliberately a NEW run_id -- the
# published as01-260728-260802 tree holds results whose folds are pinned by a
# stored stratification, and re-materializing with (k, seed) would not reproduce
# them. Nothing here writes to that tree.

run_id: as01-260728-260802-mesh

benchmark:
  source: generic_csv
  setup: anchors_to_probes
  slices: [fold_0, fold_1, fold_2, fold_3, fold_4]

  source_kwargs:
    csv_path: datasets/final/as01-20260728-20260802.mainland.sanitized.csv
    k: 5
    seed: 42
    asn_bucket_top_n: 20

  enable_fallback: true
  seed: 42

  # The five combos the published as0X runs scored, with their exact kwargs
  # (recovered from those runs' run.json). Kept identical across all finals
  # configs so mesh and weighted arms are directly comparable.
  combos:
    - combo_id: vanilla_cbg
      ltd: low_envelope
      mtl: planar_circle
      ctr: geometric_centroid
      mtl_kwargs:
        n_pts: 64
        enable_circle_filter: true

    - combo_id: million_scale_cbg
      ltd: speed_of_internet
      mtl: planar_circle
      ctr: geometric_centroid
      ltd_kwargs:
        speed_ratio: 0.6667
      mtl_kwargs:
        n_pts: 64
        enable_circle_filter: true

    - combo_id: octant_cbg_hull
      ltd: bounded_spline
      mtl: planar_annulus_weighted
      ctr: monte_carlo_medoid
      ltd_kwargs:
        fit_spline: false
        cutoff_min_points: 5
        bin_size_ms: 5.0
      mtl_kwargs:
        n_pts: 64
        enable_circle_filter: true
        weight_tau_ms: 50.0
        highest_weight_only: true
      ctr_kwargs:
        n_samples: 1024

    - combo_id: octant_cbg_spl
      ltd: bounded_spline
      mtl: planar_annulus_weighted
      ctr: monte_carlo_medoid
      ltd_kwargs:
        target_coverage: 0.9
        cutoff_min_points: 5
        fit_spline: true
        spline_n_knots: 4
        bin_size_ms: 5.0
      mtl_kwargs:
        n_pts: 64
        enable_circle_filter: true
        weight_tau_ms: 50.0
        highest_weight_only: true
      ctr_kwargs:
        n_samples: 1024

    - combo_id: spotter_cbg
      ltd: normal_dist
      mtl: planar_annulus_weighted
      ctr: monte_carlo_medoid
      ltd_kwargs:
        n_bins: 40
        min_per_bin: 5
        deg_mu: 3
        deg_sigma: 2
        bin_size_ms: 5.0
        cutoff_min_points: 5
      mtl_kwargs:
        n_pts: 64
        enable_circle_filter: true
        weight_tau_ms: 50.0
        highest_weight_only: true
      ctr_kwargs:
        n_samples: 1024

analysis:
  common:
    grid: h3
    resolution: [4]

  plot-bipartite-graph:
    # Flow map only — the topology map keeps the nearest-seed boundary,
    # which is its subject; on the flow map it competes with the edge ink
    # and shares its colour with the seed markers.
    no_flow_voronoi: true

  # --- PNI stack (§7.3, §8.1) --------------------------------------------
  # The 14-site AS20940 list read off the operator dashboard. Approximate:
  # metro identity from a screenshot, coordinates substituted from known
  # carrier hotels, CONUS-cropped. `peer_asn` is asserted explicitly because
  # the source CSV has no `target_asn` column to check the list against.
  #
  # This run shares its source CSV with the published as01-260728-260802 tree,
  # so the strategy, graph, feasibility and linearity numbers are the same
  # there -- those four commands read the CSV and are fold-free. Only
  # breakdown-sping-pni differs, because it joins classification, and the two
  # runs materialize their folds differently.
  detect-pni-strategy:
    pni_csv: datasets/pni/as01-us-pni.approx.csv
    peer_asn: 20940

  build-pni-graph:
    pni_csv: datasets/pni/as01-us-pni.approx.csv
    peer_asn: 20940
    # `mixed` verdict on as01 (no policy took a majority of determinate
    # targets), so the argmin fallback stands: it assumes no policy rather
    # than asserting one. Pass a pure rule only if the verdict declares one.
    strategy: argmin

  build-pni-feasibility:
    # 200 gives the permutation null a reportable effect size; without it
    # n_feasible has no baseline to be surprising against.
    decoy_trials: 200

  # The graph is built under a detected --strategy, so scoring on the pairs
  # the rule was chosen from would be a fit evaluated on itself.
  compare-pni-linearity:
    holdout_only: true

  breakdown-sping-pni: {}
