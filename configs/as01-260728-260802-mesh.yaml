# Mesh (unweighted) finals run for as01-260728-260802.
#
#   ./cli.sh --configfile configs/as01-260728-260802-mesh.yaml
#
# MESH arm: `generic_csv` reads a `weight` column if present and carries it into
# the parquet, but never filters on it. Deliberately a NEW run_id -- the
# published as01-260728-260802 tree holds results whose folds are pinned by a
# stored stratification, and re-materializing with (k, seed) would not reproduce
# them. Nothing here writes to that tree.

run_id: as01-260728-260802-mesh

benchmark:
  source: generic_csv
  setup: anchors_to_probes
  slices: [fold_0, fold_1, fold_2, fold_3, fold_4]

  source_kwargs:
    csv_path: datasets/final/as01-20260728-20260802.mainland.sanitized.csv
    k: 5
    seed: 42
    asn_bucket_top_n: 20

  enable_fallback: true
  seed: 42

  # The five combos the published as0X runs scored, with their exact kwargs
  # (recovered from those runs' run.json). Kept identical across all finals
  # configs so mesh and weighted arms are directly comparable.
  combos:
    - combo_id: vanilla_cbg
      ltd: low_envelope
      mtl: planar_circle
      ctr: geometric_centroid
      mtl_kwargs:
        n_pts: 64
        enable_circle_filter: true

    - combo_id: million_scale_cbg
      ltd: speed_of_internet
      mtl: planar_circle
      ctr: geometric_centroid
      ltd_kwargs:
        speed_ratio: 0.6667
      mtl_kwargs:
        n_pts: 64
        enable_circle_filter: true

    - combo_id: octant_cbg_hull
      ltd: bounded_spline
      mtl: planar_annulus_weighted
      ctr: monte_carlo_medoid
      ltd_kwargs:
        fit_spline: false
        cutoff_min_points: 5
        bin_size_ms: 5.0
      mtl_kwargs:
        n_pts: 64
        enable_circle_filter: true
        weight_tau_ms: 50.0
        highest_weight_only: true
      ctr_kwargs:
        n_samples: 1024

    - combo_id: octant_cbg_spl
      ltd: bounded_spline
      mtl: planar_annulus_weighted
      ctr: monte_carlo_medoid
      ltd_kwargs:
        target_coverage: 0.9
        cutoff_min_points: 5
        fit_spline: true
        spline_n_knots: 4
        bin_size_ms: 5.0
      mtl_kwargs:
        n_pts: 64
        enable_circle_filter: true
        weight_tau_ms: 50.0
        highest_weight_only: true
      ctr_kwargs:
        n_samples: 1024

    - combo_id: spotter_cbg
      ltd: normal_dist
      mtl: planar_annulus_weighted
      ctr: monte_carlo_medoid
      ltd_kwargs:
        deg_mu: 3
        deg_sigma: 2
        bin_size_ms: 5.0
        cutoff_min_points: 5
      mtl_kwargs:
        n_pts: 64
        enable_circle_filter: true
        weight_tau_ms: 50.0
        highest_weight_only: true
      ctr_kwargs:
        n_samples: 1024

    - combo_id: spotter_true
      ltd: normal_dist
      mtl: gaussian_density
      ctr: density_mle
      ltd_kwargs:
        deg_mu: 3
        deg_sigma: 2
        bin_size_ms: 5.0
        cutoff_min_points: 5
      mtl_kwargs:
        resolution: 4
        coarse_resolution: 2
        top_k: 64
        neighbor_ring: 1
        credible_mass: 0.95

    - combo_id: spotter_true_grid
      ltd: normal_dist
      mtl: gaussian_density
      ctr: density_argmax
      ltd_kwargs:
        deg_mu: 3
        deg_sigma: 2
        bin_size_ms: 5.0
        cutoff_min_points: 5
      mtl_kwargs:
        resolution: 4
        coarse_resolution: 2
        top_k: 64
        neighbor_ring: 1
        credible_mass: 0.95

analysis:
  common:
    grid: h3
    resolution: [4]

    # --- PNI stack (§7.3, §8.1) -----------------------------------------
    # `common:` reaches exactly the two commands that declare these --
    # detect-pni-strategy and build-pni-graph -- so they are stated once.
    #
    # `peer_asn` LABELS the peering, it does not verify it. The only hard
    # check is that the site list declares a single ASN. `target_asn` is
    # listed under `columns_unrecoverable` in every
    # datasets/final/*.reconstruction.json, so nothing connects either value
    # to this run's targets and the result is recorded as unverified
    # (`run_target_asns: []`). Pointing a run at another peer's list
    # therefore SUCCEEDS and yields a plausible-looking wrong answer --
    # verified on as02-mesh with as01's list, which reported 44.1%. Getting
    # this pair right is the operator's responsibility, not the tool's.
    pni_csv: datasets/pni/as01-us-pni.approx.csv
    peer_asn: 20940

  plot-bipartite-graph:
    # Flow map only — the topology map keeps the nearest-seed boundary,
    # which is its subject; on the flow map it competes with the edge ink
    # and shares its colour with the seed markers.
    no_flow_voronoi: true

  # --- PNI stack, non-default policy ------------------------------------
  # `strategy` is deliberately absent: argmin is already build-pni-graph's
  # default, and pinning it here would keep argmin on a run whose
  # detect-pni-strategy declares a pure rule. Pass --strategy on the command
  # line when that verdict justifies it.
  #
  # create_analysis_artifacts.sh already does that for the §7.3 figure: it
  # rebuilds tg_nearest and vp_nearest as SIDE arms, `--out-dir
  # pni-graph-<strategy>/`, so all three rules get plotted. The canonical
  # pni-graph/ that every other command resolves from the run id stays argmin,
  # which is why those arms need no key here.
  build-pni-feasibility:
    # 200 gives the permutation null a reportable effect size; the default 0
    # leaves n_feasible with no baseline to be surprising against.
    decoy_trials: 200

  # The graph is built under a detected --strategy, so scoring on the pairs
  # the rule was chosen from would be a fit evaluated on itself.
  compare-pni-linearity:
    holdout_only: true

  # Scatter min-RTT against the VP->PNI->TG propagation delay, with the
  # straight-line (no-PNI) control fitted beside it.
  #
  # Every key here is a SCHEMA MAPPING onto pni-graph/pni_edges.csv, which is
  # the only CSV in the tree carrying (VP, PNI, TG) triples. Its column names
  # differ from the command's defaults in three places, so all three must be
  # stated or the command reads the wrong columns:
  #   pni_edges.csv          command default
  #   rtt_ms                 min_rtt
  #   sel_pni_lat/lon        pni_lat/lon      <- the ASSIGNED site, per pair
  #   target_lat/lon         tg_lat/lon
  #
  # `--csv` is deliberately absent: its path carries the run id, so it is
  # passed on the command line like --split-csv rather than hardcoded here.
  #
  # `where: is_holdout` matches compare-pni-linearity's `holdout_only: true`,
  # so the figure and that table are scored on the same pairs and report the
  # same fit (verified on as01: via-PNI r2 0.6856, direct 0.6551). Two other
  # subsets are available and both are worth knowing about:
  #   is_sping_vp  -- one point per target, the VP shortest-ping picked. On
  #                   as01 the two fits collapse (r2 0.9944 vs 0.9945),
  #                   because that VP's assigned site sits on top of the
  #                   target; informative about the floor, not about routing.
  #   (unset)      -- all measured pairs, no holdout discipline.
  #
  # x_axis / x_unit are left at their defaults (via-pni, km); both fits are
  # reported either way, so the choice only moves what goes on the x axis.
  plot-pni-delay:
    rtt_col: rtt_ms
    pni_prefix: sel_pni
    tg_prefix: target
    where: is_holdout
    # View only -- every fit, the below-floor count and the median residual are
    # computed over all rows either way, and the off-view count is annotated.
    # Pinned rather than left at the data's own extent because
    # create_analysis_artifacts.sh draws one panel per assignment rule and
    # vp_nearest bends paths further than argmin does, so data-driven axes would
    # give the three panels three different scales. 5,000 km fits a mainland-US
    # target set with room to spare; a peer with intercontinental paths needs a
    # larger value here. `y_tick` fixes the gridline spacing too, so the panels
    # share a ruler rather than merely a top.
    x_max: 5000
    x_tick: 1000
    y_max: 100
    y_tick: 20

  # No `plot-pni-colocation` block here, deliberately. The §8.1 co-location
  # corner is a subset drawn against the population it was filtered from, so it
  # is declared on the WEIGHTED side: `--run-id` is the weighted run and
  # `--mesh-run-id` its parent, which is this run. See
  # configs/as01-260728-260802-weighted.yaml's `plot-pni-colocation.mesh_run_id`.
  #
  # Driving it from the arm that must exist last means a mesh run has no 5g at
  # all, rather than emitting a grey-only panel under a filename and a pair of
  # axis labels that both promise two populations.
