<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MTL map — __TITLE__</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         margin: 16px; color: #222; }
  h1 { font-size: 16px; font-weight: 600; margin: 0 0 12px 0; }
  .controls { display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
              margin-bottom: 10px; }
  .controls label { font-size: 13px; }
  .controls select, .controls input[type="search"] { font-size: 13px; padding: 4px 6px; }
  .controls select.wide { min-width: 440px; }
  .controls input.search { min-width: 220px; }
  .count { font-size: 12px; color: #666; margin-left: 4px; }
  .meta { font-size: 12px; color: #555; margin: 4px 0 10px 0; line-height: 1.5; }
  #plot { width: 100%; height: 760px; }
  .badge { font-weight: 600; padding: 1px 6px; border-radius: 4px; color: #fff; }
  .swatch { display: inline-block; width: 9px; height: 9px; border-radius: 2px;
            margin-right: 3px; vertical-align: -1px; }
  /* Hover panel. Replaces Plotly's own tooltip, which cannot hold this many
     lines legibly. `pointer-events: none` is load-bearing: the panel is drawn
     under the cursor, so if it could take the pointer it would steal the hover
     from the mark that opened it and flicker. */
  #popup { position: absolute; z-index: 20; display: none; max-width: 340px;
           pointer-events: none;
           background: #fff; border: 1px solid #bbb; border-radius: 6px;
           box-shadow: 0 4px 14px rgba(0,0,0,0.18); padding: 8px 10px;
           font-size: 12px; line-height: 1.55; color: #222; }
  #popup .ttl { font-weight: 600; margin-bottom: 4px; }
  #popup .k { color: #666; }
</style>
</head>
<body>
<h1>MTL map — __TITLE__</h1>
<div class="controls">
  <label>Status <select id="status">
    <option value="all" selected>all</option>
    <option value="fail">wrong + failed</option>
    <option value="correct">correct</option>
    <option value="wrong">wrong</option>
    <option value="failed">failed (fallback)</option>
  </select></label>
  <label>Percentile <select id="pct">
    <option value="" selected>(none)</option>
    <option value="5">p5</option>
    <option value="25">p25</option>
    <option value="50">p50</option>
    <option value="75">p75</option>
    <option value="95">p95</option>
  </select></label>
  <label>Target <select id="target" class="wide"></select></label>
  <label>Search <input id="targetSearch" class="search" type="search" placeholder="target id, fold, status"></label>
  <span id="targetCount" class="count"></span>
  <label>Projection <select id="proj">
    <option value="albers usa" selected>albers usa</option>
    <option value="natural earth">natural earth</option>
    <option value="orthographic">orthographic</option>
    <option value="equirectangular">equirectangular</option>
    <option value="robinson">robinson</option>
  </select></label>
  <label>Hide rings ≥ <select id="maxR">
    <option value="0" selected>(show all)</option>
    <option value="20000">20 000 km</option>
    <option value="10000">10 000 km</option>
    <option value="5000">5 000 km</option>
    <option value="2000">2 000 km</option>
  </select></label>
</div>
<div class="controls">
  <label><input type="checkbox" id="showVoronoi" checked> Voronoi (CONUS)</label>
  <label><input type="checkbox" id="showSeeds" checked> seed regions</label>
  <label><input type="checkbox" id="showMargin"> margin circle</label>
  <label><input type="checkbox" id="showRings" checked> LTD constraints</label>
  <label title="A disk that fully contains another is not the binding constraint, so the MTL drops it before intersecting. On by default: the surviving set is what actually formed the region."><input type="checkbox" id="keptOnly" checked> post-filter only</label>
  <label><input type="checkbox" id="showRegion" checked> feasible region</label>
  <label><input type="checkbox" id="showLatent" checked> latent VPs</label>
  <span class="count">
    <span class="swatch" style="background:#d62728"></span>top-1
    <span class="swatch" style="background:#ff8c00"></span>top-2
    <span class="swatch" style="background:#ffd700"></span>top-3
    · hover any marker for detail; a VP also isolates its constraint
  </span>
</div>
<div id="meta" class="meta"></div>
<div id="plot"></div>
<div id="popup"></div>
<script id="data" type="application/json">__PAYLOAD__</script>
<script>
__SCRIPT__
</script>
</body>
</html>
